<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Architectuurmodel</title>
<style>
:root{--bg:#ffffff;--fg:#1b1f24;--muted:#5d6672;--line:#9aa4b2;--card:#f4f6f9;--head:#e6ebf2;--accent:#2563eb;--hl:#fff3c4;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e6e9ee;--muted:#9aa4b2;--line:#6b7686;--card:#1d2229;--head:#28303a;--accent:#6ea0ff;--hl:#4a3f12;--ok:#4ade80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px}
header p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
main{padding:16px;min-width:0;position:relative}
aside{border-left:1px solid var(--line);padding:16px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
@media (max-width:860px){aside{border-left:0;border-top:1px solid var(--line);position:static;max-height:none}}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;align-items:center}
.toolbar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
select,button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.ns{border:1px dashed var(--line);border-radius:8px;margin-bottom:18px;padding:10px}
.ns>h2{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.cls{background:var(--card);border:1px solid var(--line);border-radius:6px;cursor:pointer;overflow:hidden}
.cls.sel{outline:2px solid var(--accent)}
.cls.rel{outline:2px solid var(--ok)}
.cls.dim{opacity:.35}
.cls h3{margin:0;padding:6px 8px;font-size:13px;background:var(--head);text-align:center}
.cls h3 small{display:block;font-weight:400;color:var(--muted)}
.cls .badge{display:inline-block;margin-top:2px;padding:0 6px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:500}
.cls ul{list-style:none;margin:0;padding:6px 8px;border-top:1px solid var(--line);font:12px ui-monospace,monospace;overflow-wrap:anywhere}
.cls ul:empty{display:none}
svg.lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.lines .hit{pointer-events:stroke;cursor:pointer;stroke:transparent;stroke-width:12;fill:none}
svg.lines .vis{fill:none;stroke:var(--line);stroke-width:1.4}
svg.lines .vis.sel{stroke:var(--accent);stroke-width:2.6}
svg.lines .vis.dim{opacity:.15}
aside h2{margin:0 0 6px;font-size:15px}
aside .muted{color:var(--muted)}
aside ul{padding-left:18px;margin:6px 0}
aside li{margin:3px 0}
a.link{color:var(--accent);cursor:pointer;text-decoration:underline}
code{font-family:ui-monospace,monospace;font-size:12px}
.seq{overflow-x:auto}
.seq svg{display:block;min-width:100%}
.seq .msg{cursor:pointer}
.seq .msg:hover text,.seq .msg.sel text{font-weight:700}
.seq .msg.sel line,.seq .msg.sel path{stroke:var(--accent)}
.empty{color:var(--muted);padding:24px}
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="desc"></p></header>
<div class="layout">
  <main id="main"></main>
  <aside id="side"><p class="muted">Klik op een element of relatie voor details.</p></aside>
</div>
<script id="model" type="application/json">__MODEL__</script>
<script>
const M = JSON.parse(document.getElementById('model').textContent);
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
const NS = 'http://www.w3.org/2000/svg';
const sv = (tag, attrs = {}, ...kids) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};
$('#title').textContent = M.title || 'Model';
$('#desc').textContent = M.description || '';
document.title = M.title || 'Architectuurmodel';
const side = $('#side'), main = $('#main');

if (M.kind === 'sequence') renderSequences(); else renderClasses();

/* ---------- klassen / domein / database ---------- */
function renderClasses() {
  const groups = M.groups || [];
  const items = new Map();
  groups.forEach(g => (g.classes || g.tables || []).forEach(c => items.set(c.name, { c, ns: g.namespace })));
  const rels = (M.relations || []).filter(r => items.has(r.from) && items.has(r.to));
  const visibleNs = new Set(groups.map(g => g.namespace));
  let selClass = null, selRel = null;

  const bar = el('div', { class: 'toolbar' }, el('strong', {}, 'Namespaces:'));
  groups.forEach(g => bar.append(el('label', {},
    el('input', { type: 'checkbox', checked: '', onchange: e => { e.target.checked ? visibleNs.add(g.namespace) : visibleNs.delete(g.namespace); build(); } }),
    g.namespace)));
  const wrap = el('div');
  const svg = sv('svg', { class: 'lines' });
  main.append(bar, wrap, svg);
  svg.innerHTML = '<defs>' + [
    ['tri', '<path d="M0,0 L10,5 L0,10 z" fill="var(--bg)" stroke="var(--line)"/>', 10, 5],
    ['open', '<path d="M0,0 L10,5 L0,10" fill="none" stroke="var(--line)"/>', 10, 5],
    ['dia', '<path d="M0,5 L7,0 L14,5 L7,10 z" fill="var(--line)" stroke="var(--line)"/>', 0, 5],
    ['dia0', '<path d="M0,5 L7,0 L14,5 L7,10 z" fill="var(--bg)" stroke="var(--line)"/>', 0, 5]
  ].map(([id, p, rx, ry]) => `<marker id="${id}" viewBox="0 0 14 10" markerWidth="14" markerHeight="10" refX="${rx}" refY="${ry}" orient="auto-start-reverse" markerUnits="userSpaceOnUse">${p}</marker>`).join('') + '</defs>';

  function build() {
    wrap.replaceChildren();
    groups.filter(g => visibleNs.has(g.namespace)).forEach(g => {
      const grid = el('div', { class: 'grid' });
      (g.classes || g.tables || []).forEach(c => grid.append(card(c)));
      wrap.append(el('section', { class: 'ns' }, el('h2', {}, g.namespace), grid));
    });
    if (!wrap.children.length) wrap.append(el('p', { class: 'empty' }, 'Geen namespace geselecteerd.'));
    requestAnimationFrame(draw);
    paint();
  }
  function members(c) {
    if (c.columns) return c.columns.map(k => `${k.pk ? '🔑 ' : k.fk ? '↗ ' : ''}${k.name}: ${k.type}${k.nullable ? '?' : ''}`);
    return [...(c.attributes || []), ...(c.methods || [])];
  }
  function card(c) {
    const attrs = c.columns ? members(c) : (c.attributes || []);
    const meths = c.columns ? [] : (c.methods || []);
    return el('div', { class: 'cls', 'data-name': c.name, onclick: () => { selClass = c.name; selRel = null; paint(); show(); } },
      el('h3', {}, c.stereotype ? el('small', {}, `«${c.stereotype}»`) : null, c.name,
        c.pattern ? el('div', {}, el('span', { class: 'badge' }, c.pattern)) : null),
      el('ul', {}, attrs.map(a => el('li', {}, a))),
      el('ul', {}, meths.map(a => el('li', {}, a))));
  }
  function rect(name) {
    const n = wrap.querySelector(`[data-name="${CSS.escape(name)}"]`);
    if (!n) return null;
    const r = n.getBoundingClientRect(), m = main.getBoundingClientRect();
    return { x: r.left - m.left, y: r.top - m.top, w: r.width, h: r.height };
  }
  function edge(a, b) {
    const cx = a.x + a.w / 2, cy = a.y + a.h / 2, dx = b.x + b.w / 2 - cx, dy = b.y + b.h / 2 - cy;
    if (!dx && !dy) return [cx, cy];
    const t = Math.min(dx ? (a.w / 2) / Math.abs(dx) : Infinity, dy ? (a.h / 2) / Math.abs(dy) : Infinity);
    return [cx + dx * t, cy + dy * t];
  }
  const STYLE = {
    inheritance: { end: 'tri' }, realization: { end: 'tri', dash: 1 },
    composition: { start: 'dia' }, aggregation: { start: 'dia0' },
    association: { end: 'open' }, dependency: { end: 'open', dash: 1 }
  };
  function draw() {
    const m = main.getBoundingClientRect();
    svg.setAttribute('width', m.width); svg.setAttribute('height', m.height);
    svg.querySelectorAll('g.r').forEach(n => n.remove());
    rels.forEach((r, i) => {
      const a = rect(r.from), b = rect(r.to);
      if (!a || !b || r.from === r.to) return;
      const [x1, y1] = edge(a, b), [x2, y2] = edge(b, a);
      const s = STYLE[r.type] || STYLE.association;
      const d = `M${x1},${y1} L${x2},${y2}`;
      const vis = sv('path', { d, class: 'vis', 'data-i': i });
      if (s.dash) vis.setAttribute('stroke-dasharray', '6 4');
      if (s.end) vis.setAttribute('marker-end', `url(#${s.end})`);
      if (s.start) vis.setAttribute('marker-start', `url(#${s.start})`);
      const hit = sv('path', { d, class: 'hit' });
      hit.addEventListener('click', () => { selRel = i; selClass = null; paint(); show(); });
      const g = sv('g', { class: 'r' }, vis, hit);
      const lab = [r.label, r.multiplicity].filter(Boolean).join(' ');
      if (lab) g.append(sv('text', { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 4, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--muted)' }, lab));
      svg.append(g);
    });
    paint();
  }
  function paint() {
    const near = new Set();
    if (selClass) rels.forEach(r => { if (r.from === selClass) near.add(r.to); if (r.to === selClass) near.add(r.from); });
    if (selRel != null) { near.add(rels[selRel].from); near.add(rels[selRel].to); }
    const any = selClass || selRel != null;
    wrap.querySelectorAll('.cls').forEach(n => {
      const nm = n.dataset.name;
      n.classList.toggle('sel', nm === selClass);
      n.classList.toggle('rel', any && nm !== selClass && near.has(nm));
      n.classList.toggle('dim', any && nm !== selClass && !near.has(nm));
    });
    svg.querySelectorAll('.vis').forEach(p => {
      const r = rels[+p.dataset.i];
      const on = selRel === +p.dataset.i || (selClass && (r.from === selClass || r.to === selClass));
      p.classList.toggle('sel', !!on);
      p.classList.toggle('dim', any && !on);
    });
  }
  function link(name) { return el('a', { class: 'link', onclick: () => { selClass = name; selRel = null; paint(); show(); } }, name); }
  function show() {
    side.replaceChildren();
    if (selRel != null) {
      const r = rels[selRel];
      side.append(el('h2', {}, `${r.from} → ${r.to}`),
        el('p', {}, el('strong', {}, r.type || 'association'), r.label ? ` · ${r.label}` : '', r.multiplicity ? ` · ${r.multiplicity}` : ''),
        el('p', {}, r.description || 'Geen toelichting.'),
        el('p', {}, link(r.from), ' · ', link(r.to)));
      return;
    }
    if (!selClass) return;
    const { c, ns } = items.get(selClass);
    side.append(el('h2', {}, c.name), el('p', { class: 'muted' }, `${ns}${c.stereotype ? ' · «' + c.stereotype + '»' : ''}${c.pattern ? ' · ' + c.pattern : ''}`));
    if (c.description) side.append(el('p', {}, c.description));
    if (c.grasp) side.append(el('p', {}, el('strong', {}, 'GRASP: '), c.grasp));
    if (c.note) side.append(el('p', {}, c.note));
    const mine = rels.map((r, i) => ({ r, i })).filter(({ r }) => r.from === selClass || r.to === selClass);
    side.append(el('h2', {}, 'Relaties'), mine.length ? el('ul', {}, mine.map(({ r, i }) => el('li', {},
      el('a', { class: 'link', onclick: () => { selRel = i; selClass = null; paint(); show(); } }, r.type || 'association'),
      ` ${r.from === selClass ? '→' : '←'} `, link(r.from === selClass ? r.to : r.from), r.label ? ` (${r.label})` : ''))) : el('p', { class: 'muted' }, 'Geen.'));
    if (c.indexes) side.append(el('h2', {}, 'Indexen'), el('ul', {}, c.indexes.map(x => el('li', {}, el('code', {}, x)))));
    const all = members(c);
    if (all.length) side.append(el('h2', {}, 'Leden'), el('ul', {}, all.map(x => el('li', {}, el('code', {}, x)))));
  }
  addEventListener('resize', draw);
  build();
}

/* ---------- sequentiediagrammen ---------- */
function renderSequences() {
  const seqs = M.sequences || [];
  if (!seqs.length) { main.append(el('p', { class: 'empty' }, 'Geen sequenties.')); return; }
  const pick = el('select', { onchange: () => draw(+pick.value) }, seqs.map((s, i) => el('option', { value: i }, s.title)));
  const box = el('div', { class: 'seq' });
  main.append(el('div', { class: 'toolbar' }, el('strong', {}, 'Use case:'), pick), box);
  function draw(i) {
    const s = seqs[i];
    side.replaceChildren(el('h2', {}, s.title), el('p', {}, s.description || ''), el('p', { class: 'muted' }, 'Klik op een bericht voor details.'));
    const P = s.participants, colW = 170, top = 50, rowH = 38;
    const idx = Object.fromEntries(P.map((p, k) => [p.id, k]));
    const W = Math.max(P.length * colW, 360), H = top + s.steps.length * rowH + 30;
    const svg = sv('svg', { width: W, height: H, viewBox: `0 0 ${W} ${H}` });
    const X = id => colW / 2 + idx[id] * colW;
    P.forEach(p => {
      svg.append(sv('line', { x1: X(p.id), x2: X(p.id), y1: 34, y2: H - 10, stroke: 'var(--line)', 'stroke-dasharray': '4 4' }));
      svg.append(sv('rect', { x: X(p.id) - 70, y: 6, width: 140, height: 28, rx: 5, fill: 'var(--head)', stroke: 'var(--line)' }));
      svg.append(sv('text', { x: X(p.id), y: 25, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--fg)' }, p.name));
    });
    let n = 0;
    s.steps.forEach((st, k) => {
      const y = top + k * rowH + 14;
      const g = sv('g', { class: 'msg' });
      if (['alt', 'else', 'opt', 'loop', 'end'].includes(st.type)) {
        g.append(sv('line', { x1: 8, x2: W - 8, y1: y, y2: y, stroke: 'var(--line)', 'stroke-dasharray': '2 3' }));
        if (st.type !== 'end') g.append(sv('text', { x: 12, y: y - 4, 'font-size': 11, fill: 'var(--muted)' }, `[${st.type}] ${st.label || ''}`));
        svg.append(g); return;
      }
      if (st.type === 'note') {
        const x = X(st.from);
        g.append(sv('rect', { x: x - 60, y: y - 14, width: 120, height: 24, fill: 'var(--hl)', stroke: 'var(--line)' }),
          sv('text', { x, y: y + 2, 'text-anchor': 'middle', 'font-size': 11, fill: 'var(--fg)' }, st.label));
      } else {
        const a = X(st.from), b = X(st.to), dir = b >= a ? 1 : -1;
        const dash = st.type === 'return' ? '5 3' : '';
        if (a === b) {
          g.append(sv('path', { d: `M${a},${y - 8} h30 v16 h-30`, fill: 'none', stroke: 'var(--fg)', 'stroke-dasharray': dash }),
            sv('path', { d: `M${a + 7},${y + 4} L${a},${y + 8} L${a + 7},${y + 12}`, fill: 'none', stroke: 'var(--fg)' }),
            sv('text', { x: a + 36, y: y + 3, 'font-size': 12, fill: 'var(--fg)' }, `${st.type === 'return' ? '' : ++n + '. '}${st.label}`));
        } else {
          g.append(sv('line', { x1: a, x2: b - dir * 2, y1: y, y2: y, stroke: 'var(--fg)', 'stroke-dasharray': dash }),
            sv('path', { d: `M${b - dir * 9},${y - 4} L${b},${y} L${b - dir * 9},${y + 4}`, fill: st.type === 'async' ? 'none' : 'var(--fg)', stroke: 'var(--fg)' }),
            sv('text', { x: (a + b) / 2, y: y - 5, 'text-anchor': 'middle', 'font-size': 12, fill: 'var(--fg)' }, `${st.type === 'return' ? '' : ++n + '. '}${st.label}`));
        }
        g.append(sv('rect', { x: Math.min(X(st.from), X(st.to || st.from)) - 4, y: y - 16, width: Math.abs(X(st.from) - X(st.to || st.from)) + 40, height: 28, fill: 'transparent' }));
      }
      g.addEventListener('click', () => {
        svg.querySelectorAll('.msg.sel').forEach(x => x.classList.remove('sel'));
        g.classList.add('sel');
        side.replaceChildren(el('h2', {}, st.label),
          el('p', { class: 'muted' }, st.to ? `${nameOf(st.from)} → ${nameOf(st.to)}` : nameOf(st.from)),
          el('p', {}, st.detail || 'Geen toelichting.'));
      });
      svg.append(g);
    });
    function nameOf(id) { return (P.find(p => p.id === id) || {}).name || id; }
    box.replaceChildren(svg);
  }
  draw(0);
}
</script>
</body>
</html>
