# Register organisatiemodel 1.0: analyse en ontwerp in Claude Code
# Bron van waarheid. Overzichten, procesbeschrijvingen en het artifact zijn weergaven hiervan.
# Legenda: PRC proces · ACT stap · GOV akkoordmoment van ROL-01 · ROL rol · AGT agent · CAP capability
# ASM aanname · OPEN open vraag · FND bevinding · PRP voorstel · CHG wijziging · B besluit van ROL-01 · D doel
# UC1 = nieuwe klant (PRC-01) · UC2 = backlog per slice (PRC-02) · FR / NFR = functionele / niet-functionele eis
# P1 / P2 / P3 = architectuurprofiel (CMS / component-app / maatwerk). Korte namen: zie korte_namen onderaan.

