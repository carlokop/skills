rollen:
  - id: ROL-01
    naam: "Project owner"
    mens: true
    situatie: to-be
    label: besloten
    verantwoordelijkheid: "Geeft de opdracht in de hoofdsessie en maakt de klantrepo aan. Beantwoordt vragen en geeft akkoord of afkeuring op de poorten GOV-10, GOV-15, GOV-11, GOV-17, GOV-06 en GOV-18. Kiest de volgende slice of wens als het plan dat niet bepaalt (GOV-07), beslist bij escalatie (GOV-08) en over wijzigingsverzoeken en productkeuzes (GOV-12). Ontwerper zolang er geen ontwerp-agent is (ASM-28); een eigen ontwerp keurt hij niet apart goed, wel de daarop afgestemde paginabrieven (ASM-86). Zet een backlog-item op klaar als het gebouwd en gemerged is (ASM-89). Enig contact met de klant."
    bron: "0.18 ROL-01 en ASM-28; B-30, B-32, B-35"
    as_is_0_18: "Gelijk, maar akkoorden via kaarten op Paperclip-issues, herinnering elke werkdag 09:00 door Dr. Evil, en bouwen, testen en mergen in PRC-10."
  - id: ROL-02
    naam: "Regie"
    vorige_naam: "Orchestrator en scrum master (0.18)"
    mens: false
    situatie: to-be
    label: besloten
    verantwoordelijkheid: "Start Socrates, Atlas en de controleurs met een zelfstandige opdracht; laat het werk vóór elk akkoord controleren; stelt de open vragen aan ROL-01 (hoogstens 4 per dialoog) en geeft de antwoorden letterlijk terug; start de ander bij een verzoek aan de ander; bewaakt de volgorde en de poorten; zet de werkpakketten van Atlas om in backlog-items en houdt de map docs/backlog/ bij; draait het ritme (PRC-07); meldt blokkades en escalaties aan ROL-01. Beslist niets namens ROL-01 en schrijft geen eisen of ontwerp."
    definitie: "bestaat: geen agentdefinitie; regie aangepast en backlog-regie nieuw in fase 1 (PRP-072, PRP-075, PRP-077, PRP-080, PRP-081; CHG-072, CHG-078)"
    wijziging_1_0_22: "CHG-062: veld definitie erbij, zoals op de pagina"
    bron: "agents/socrates/skills/regie/SKILL.md; B-30, B-33, B-37, B-38"
    as_is_0_18: "Dr. Evil (AGT-01) in Paperclip: enig loket, project aanmaken, routines weekmoment en dagstart, flowcheck, herinnering, epics en taken, vaste controles, backlog gereed, overdracht aan ROL-01 (PRC-10)."
  - id: ROL-03
    naam: "Business analist"
    mens: false
    situatie: to-be
    label: besloten
    verantwoordelijkheid: "Wat en waarom: requirements (FR en NFR), visie met projecttype, use cases met acceptatiecriteria, bedrijfsregels, bedrijfstermen in GLOSSARY.md, paginalijst met nu en later, paginabrieven en het afstemmen van de brieven op de ontwerp-export van ROL-01, de kern markeren. Analyseert een nieuwe wens in de begintak van UC2 (B-36). Enige bron voor de bedoeling van goedgekeurde eisen. Juridische keuzes: ASM-81."
    definitie: "bestaat: socrates.md verandert door geen voorstel; r.30 gewijzigd door B-55 vraag 4 (regels onder 'Voor de bouw' niet volgen in het voorwerk; CHG-078)"
    wijziging_1_0_22: "CHG-062: veld definitie erbij, zoals op de pagina"
    bron: "agents/socrates/agents/socrates.md; 0.18 ROL-03"
    as_is_0_18: "Gelijk, plus Paperclip-taken: project aanmaken bij een rechtstreekse opdracht en die melden aan Dr. Evil, toets-issue voor Atlas, akkoord via kaart."
  - id: ROL-04
    naam: "Systeemarchitect"
    mens: false
    situatie: to-be
    label: "feit (instructies van Atlas), behalve waar besloten staat"
    verantwoordelijkheid: "Hoe het technisch werkt. Toetst use cases en paginabrieven vóór het akkoord (atlas.md r.37). Architectuurkeuze met profiel en ADR's (r.38); technisch ontwerp volgens profiel (r.39; P3: domeinmodel en sequentiediagrammen intern, klassendiagram en database als één document, r.72). Opdeling in slices met technische volgorde (r.40); dat die opdeling als voorlopig sliceplan een eigen akkoord krijgt (GOV-17) is besloten (B-32), niet in de skills (FND-097). Per slice het program design (B-31): het ontwerp per slice (zo heet het detailontwerp in de skills, architect-implementation-plan r.192), het implementatieplan met werkpakketten (r.43) en het API-contract als bouwcontract (r.41). Eén conventiebestand per project, en in slice 1 ook de kwaliteitslat (CONSTRAINTS.md) en de regelbestanden (CLAUDE.md, AGENTS.md), na het bouwcontract (architect-conventions r.3; CHG-056, B-47); bij een nieuwe NFR of afspraak werkt hij ze bij in ACT-02.6 en ACT-02.7 (ASM-120). Toetst de backlog-items tegen zijn werkpakketten; in de instructies alleen als de aanroeper dat vraagt, na twee rondes of bij een conflict beslist ROL-01 (r.44); standaard vóór GOV-18 is ASM-83. Beantwoordt vragen over het ontwerp (r.45; PRC-04), ook van de hoofdsessie over de werkpakketten (ASM-109). Doet een verzoek aan Socrates als een eis technisch problematisch is, met probleem en opties (r.83; via PRC-04). Houdt STATUS.md bij met fase, status, datum van akkoord en bestanden, ook van de goedkeuring van eisen zoals de aanroeper die meldt (r.75; ASM-80). De Engelse termen uit de modellen in GLOSSARY.md, met de Nederlandse term (r.48; uml-sequence-diagrams r.17: regel _NL_:), en ADR's bij elke wijziging van het globale ontwerp (r.48). Ontwerppagina als HTML van een ontwerpdocument (r.46). Signaleert bij een uitbreiding of het globale ontwerp of het profiel verandert (groeisignalen, r.40, r.78). Maakt geen taken, issues of backlog-items (r.43)."
    definitie: "bestaat: atlas.md aangepast voor PRP-079 (r.40, r.74), PRP-080 (r.44) en PRP-084 (r.42, r.61, r.102) in fase 2/3, en r.30 voor B-55 vraag 4 (CHG-078)"
    wijziging_1_0_22: "CHG-062: het bijwerken van de regelbestanden (ASM-120), vragen van de hoofdsessie (ASM-109) en het veld definitie erbij (feitencontrole Atlas op 1.0.20)"
    bron: "agents/atlas/agents/atlas.md (regelnummers r.); agents/atlas/skills/architect-implementation-plan, architect-conventions; feitencontrole Atlas 2026-11-25; B-31, B-32"
    as_is_0_18: "Gelijk in inhoud: de opdeling, de API-contracten, het implementatieplan en de toets van de taken deed hij ook in 0.18 (TL-V6, CHG-006; ACT-01.25, ACT-02.14). Ontwerp per slice en plan kwamen alleen bij Carlo als een voorwaarde gold. De opdeling had geen controleur, en de inhoud van slice 1 ging mee in GOV-06 (0.18 bevindingen.md r.64, FND-022). Slice 1 hoorde bij UC1."
