  eindontwerp: {pad: "organisatie/eindontwerp.html", versie: "1.0 (conceptversie 1.0.28, Goedgekeurd 2026-11-25, B-51)", documenten_in_diagrammen: "Notities 'Document: <naam> (<pad>)' direct na de stap die het document maakt, en in de labels van eindberichten, opdrachten en hervattingen wat de ander leest (K1, K2, K3, K5). Bron: input en output in 'activiteiten', communicatiemodel.md en de documentlocaties (systemen, ASM-104, OPEN-35, OPEN-48, ASM-101). Waar geen pad vastligt, staat er geen (uitbreidingslijst; de leesbare versie en de P1-tabel 'op de documentlocatie'). De paden zijn de standaard, tenzij het project iets anders voorschrijft (atlas.md r.31). CHG-067, op verzoek van Carlo; in 1.0.26 aangevuld na de feitencontrole van Atlas (CHG-068)", interactieweergave: "gebouwd door de hoofdsessie, gepubliceerd als artifact-versie 3 (2026-11-25): de zeven sequenceDiagrams renderen zonder fouten in Mermaid 11.4.1 (40, 36, 17, 14, 6, 5 en 5 berichten met een lijn, op 1.0.23); klik op een bericht opent de stap, klik op een kolomnaam toont het verkeer van die kolom; het paneel toont OLD en OLD_ALG (melding hoofdsessie). Bronblokken bijgewerkt in 1.0.24 (CHG-065); opnieuw renderen nodig", interactiediagrammen: "per proces een sequenceDiagram in <pre class=\"dia-src\" id=\"seq-PRC-xx\">, met dezelfde bron als de sectie 'Interactiediagram' in processen/PRC-01 t/m PRC-07 (B-49, CHG-064; als weergave van model 1.0 goedgekeurd in B-51). Kolommen Carlo, hoofdsessie, Socrates, Atlas en de controleurs; elk berichtlabel begint met het ACT-, GOV- of G-ID. De stroomschema's dia-PRC-xx zijn ongewijzigd. De hoofdsessie bouwt de weergave (interactie als hoofdweergave, stroomschema als tweede)", oude_werkwijze: "OLD per ACT-ID en OLD_ALG in de data van de pagina, uit was_0_18 in 'activiteiten' en communicatiemodel.md §2 (B-49, ASM-122 afgewezen)", bron: "dit register (versie 1.0.19, ronde 3 Goedgekeurd, met de administratieve correctie CHG-062) en de documenten in organisatie/", artifact_url: "https://claude.ai/artifact/ANUAhKozbFvzZaToJB4dvj (gepubliceerd door de hoofdsessie, 2026-11-25; artifact-versie 8 is de goedgekeurde weergave van model 1.0, met 14 diagrammen die renderen (melding hoofdsessie); bij een nieuwe versie opnieuw naar dezelfde URL)", diagrammen: "de pagina tekent zelf, met Mermaid 11.4.1 van cdn.jsdelivr.net (vaste versie; dat CDN staat op de toegestane lijst van het platform (melding hoofdsessie)). De bronnen staan als verborgen blokken <pre class=\"dia-src\"> in de pagina; lukt het tekenen niet, dan toont de pagina de bron. Op verzoek van Carlo, door de hoofdsessie, 2026-11-25 (CHG-063). Was in 1.0.21: blokken <pre class=\"mermaid\"> die het platform tekende (CHG-061); in 1.0.20: hetzelfde CDN", viewer: "zoomen met knoppen, scrollwiel of twee vingers; verschuiven door te slepen; knoppen Breedte, Passend, 100% en Groot scherm. Klik op een element: het element, zijn pijlen, de verbonden elementen en hun swimlanes lichten op (eigen lane volle rand, lanes van de buren gestippeld), de rest wordt gedimd; klik op een stap opent ook het paneel; nog eens klikken of klikken op een lege plek heft de selectie op (CHG-063)", getest: "door de hoofdsessie in Chrome headless, 2026-11-25: PRC-01 36 knopen, 45 pijlen, 5 lanes; PRC-04 25 knopen, 28 pijlen, 4 lanes; klikken, groot scherm en thema-wissel werken. Niet getest: de andere processen afzonderlijk, een echte telefoon"}
