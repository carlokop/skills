besluiten:
  - {id: B-28, tekst: "Paperclip gaat offline; alles draait in Claude Code. Nieuw model 1.0 in organisatie/ met 0.18 als vaste as-is-bron. Onderdelen die blijven, houden hun 0.18-nummer; nieuwe onderdelen nummeren verder na de laatste uit 0.18.", bron: "opdracht van ROL-01 (2026-11-25); antwoorden 1 en 2 (2026-11-25)"}
  - {id: B-29, tekst: "Scope tot en met het gevulde backlog. ROL-01 implementeert daarna zelf met de andere agents. Alles na het backlog staat alleen als buiten scope, met verwijzing naar 0.18.", bron: "opdracht (2026-11-25); antwoord 3 (2026-11-25)"}
  - {id: B-30, tekst: "Atlas levert werkpakketten. De hoofdsessie zet ze met de skill regie om in backlog-items, en ROL-01 keurt ze goed. Er komt geen orchestrator-agent. De hoofdsessie neemt van Dr. Evil over: doorgeven, vragen stellen en werkpakketten omzetten in backlog-items.", bron: "opdracht (2026-11-25); antwoord 5 (2026-11-25)"}
  - {id: B-31, tekst: "Geen aparte tech lead. Atlas doet ook het program design en atlas-licht controleert dat. Program design per slice = het detailontwerp, het implementatieplan met werkpakketten en het API-contract.", bron: "opdracht (2026-11-25); antwoord 9 (2026-11-25)", toevoeging_socrates: "Het detailontwerp heet in de skills 'ontwerp per slice' (architect-implementation-plan r.192). Dit is een toelichting, geen deel van het besluit."}
  - {id: B-32, tekst: "De poorten zijn generiek: analysepakket, richting, ontwerp, bouwcontract, backlog. Projectregels mogen ze aanscherpen (voorbeeld: asp-facturen). Het voorlopige sliceplan krijgt een eigen poort en gaat niet mee in het akkoord op het ontwerp.", bron: "opdracht (2026-11-25); antwoord 8 (2026-11-25, tegen het advies in)"}
  - {id: B-33, tekst: "Er komt een vast ritme met een wekmechanisme. Wat technisch niet vaststaat volgens claude-code-feiten.md, staat als open vraag of risico.", bron: "antwoord 4 (2026-11-25, tegen het advies in)"}
  - {id: B-34, tekst: "socrates-licht en atlas-licht krijgen een eigen plek (eigen lanes), met controle vóór elk akkoord.", bron: "antwoord 6 (2026-11-25)"}
  - {id: B-35, tekst: "UC1 stopt bij het ontwerp met het voorlopige sliceplan. Ook slice 1 loopt via UC2.", bron: "opdracht (2026-11-25); antwoord 7 (2026-11-25)"}
  - {id: B-36, tekst: "UC2 heeft een optionele begintak voor een nieuwe wens buiten het plan: Socrates analyseert, Atlas werkt ontwerp en plan bij, daarna volgt de slice-loop.", bron: "antwoord 10 (2026-11-25)"}
  - {id: B-37, tekst: "Het backlog is een bestand in de klantrepo.", bron: "antwoord 11 (2026-11-25)"}
  - {id: B-38, tekst: "Alle overdracht tussen agents loopt via de hoofdsessie. Agents starten elkaar niet; er komen geen agent teams.", bron: "antwoord 12 (2026-11-25)"}
  - {id: B-39, tekst: "Vier rondes (organisatieanalyse, procesmodellering, rollen- en skillmodel, eindontwerp), met akkoord van ROL-01 na elke ronde. Feiten over Claude Code alleen uit claude-code-feiten.md. Skills en agentdefinities worden in dit traject niet gewijzigd.", bron: "opdracht (2026-11-25)"}
  - {id: B-40, tekst: "Het weekmoment is op maandag om 12:00 Nederlandse tijd, met een cron-taak in de hoofdsessie van het project.", bron: "antwoorden 11 en 15 (2026-11-25; 11 tegen het advies in, dat 09:00 was)", toelichting_hoofdsessie: "Er moet een Claude Code-sessie van het project open zijn (terminal of VS Code-extensie). Staan computer of sessie uit, dan slaat de geplande taak het moment over; de inhaalcheck vangt dat op bij het openen. Of geplande taken in de VS Code-extensie net zo werken als in de terminal, staat niet in de feiten (OPEN-40)."}
  - {id: B-41, tekst: "De dagstart heeft geen vaste tijd. Hij draait alleen als ROL-01 de sessie van het project opent of hervat: backlog tellen, melden wat op ROL-01 wacht, en zo nodig de volgende slice starten.", bron: "antwoord 12 (2026-11-25, 'Alleen bij openen'; tegen het advies in, dat werkdagen 09:00 was)"}
  - {id: B-42, tekst: "De dagstart start de volgende slice als de lopende slice nog 10 of minder open backlog-items heeft.", bron: "antwoord 14 (2026-11-25, '10 of minder'; tegen het advies in, dat 5 was)"}
  - {id: B-55, tekst: "B-54 bevestigd en aangescherpt. (1) De oude Paperclip-skills in skills/ zijn weggehaald (afbouwlijst C1, uitgevoerd door de hoofdsessie met git rm) en de root-README.md r.19 is neutraal (C4, uitgevoerd); het uitzetten van Paperclip zelf (B1 t/m B4) is geen voorwaarde voor de werkwijze: of en wanneer Paperclip uitgaat, beslist ROL-01 zelf; A5 blijft de aanbevolen volgorde vóór het uitzetten (ASM-107, ASM-108). De bouwskills code-reviewer en testplan-en-rapport blijven (C2, buiten dit model). (2) Voorstel CHG-075 goedgekeurd: de traceertabel van het domeinmodel staat alleen in het eigen regeldocument van Atlas; uml-domain-modelling r.72 aangepast door Atlas. (3) De zes werkregels in AGENTS.md van elk klantproject (ASM-118). (4) CLAUDE.md van een klantproject krijgt de kop 'Voor de bouw' met de drie leesmomenten; Socrates, Atlas en hun lichte varianten volgen die regels niet in het voorwerk (ASM-117; socrates.md r.30, socrates-licht.md r.26, atlas.md r.30, atlas-licht.md r.29). Alle antwoorden volgen het advies; geen nacontrole nodig (B-44, antwoord 3). Vastgelegd in CHG-078", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie. Toelichting letterlijk: 'in de repo ../skills mogen alle paperclip skills weg maar ik wil paperclip niet als eis voor deze workflow moeten verwijderen.' Vragen (ingekort doorgegeven) en antwoorden letterlijk: 1 'Klopt deze lezing van wat je schreef: de oude Paperclip-skills in skills/ gaan nu weg (backlog-management, weekmoment, quality-gates, delivery-management, escalation-management, agent-orchestration, requirements-orchestration, dependency-management, sprint-planning, oordeel-hulp), en het uitzetten van Paperclip zelf is geen voorwaarde voor de nieuwe werkwijze? ...' 'Ja, zo' (niet gekozen: ook de Paperclip-resten in code-reviewer en testplan-en-rapport opruimen); 2 voorstel CHG-075 'Ja, alleen bij Atlas'; 3 'Komen deze zes werkregels in AGENTS.md van elk klantproject? (1) Alleen jij of je bouwsessie verplaatst een taak naar in-progress en done. (2) Een implementatie- of ontwerpvraag gaat naar Atlas. (3) Een vraag over een eis of paginabrief gaat naar Socrates. (4) Een nieuw component zonder goedgekeurd ontwerp is een vraag aan de ontwerper (jij). (5) Een ontwerpafwijking die een reviewer ziet, gaat naar Atlas. (6) De commando's in CLAUDE.md zijn voorlopig; de eerste bouwsessie mag ze corrigeren, met een melding aan Atlas. ...' 'Ja, deze zes'; 4 'Krijgt CLAUDE.md van een klantproject een kop Voor de bouw met de drie leesmomenten (...), en slaan Socrates, Atlas en hun lichte varianten alles onder die kop over in hun voorwerk? ...' 'Ja, Voor de bouw'"}
  - {id: B-54, tekst: "Geen Paperclip in de workflow:de Paperclip-resten in de plugins socrates en atlas gaan eruit (afbouwlijst C3, doorgevoerd in fase 1 t/m 4). Of en wanneer de oude Paperclip-skills in skills/ weggaan, beslist ROL-01 zelf; dat is geen stap van de afbouw meer (ASM-107 gewijzigd; afbouwlijst C1 en C4). Dit is de lezing van de hoofdsessie van Carlo's woorden, vastgelegd in CHG-074; de hoofdsessie vraagt Carlo de lezing in één vraag te bevestigen. Tot dan staat het als lezing", status: "bevestigd en aangescherpt door B-55 (2026-11-25): skills/ is opgeruimd (C1, C4), het uitzetten van Paperclip is geen voorwaarde", bron: "bericht van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: 'kun je alles tot fase 4 doen. ik wil niet dat iets van paperclip in deze workflow zit. ik bepaal zelf of ik die alsnog verwijder en wanneer. dit hoeft niet in fase 5 te zitten.'"}
  - {id: B-53, tekst: "Voorstel CHG-073 goedgekeurd: elk taakbestand neemt uit het plan van Atlas het paginatype bij een paginataak over, bij een opruimtaak het veld 'Opruimen vanaf' (trigger of datum), en in het veld Werkpakket ook het pad van het implementatieplan; bij een taak zonder pagina staat 'n.v.t.' bij paginabrief en paginatype; de hoofdsessie controleert bij 'backlog gereed', vóór GOV-18, dat elke paginataak een paginabrief en een paginatype noemt en elke opruimtaak 'Opruimen vanaf'. Alle antwoorden volgen het advies; geen nacontrole nodig (B-44, antwoord 3). ASM-102, ACT-02.11 en ACT-02.54 bijgewerkt; B-45 blijft het historische besluit over ASM-102", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie, op vijf vragen (ingekort doorgegeven): 1 'Neemt elk taakbestand bij een paginataak (een taak die een pagina bouwt) het paginatype over uit het plan van Atlas? ...' 'Ja, overnemen'; 2 'Neemt een opruimtaak over vanaf wanneer iets ouds mag worden weggehaald? ... Advies: ja, in een veld Opruimen vanaf. ...' 'Ja, Opruimen vanaf'; 3 'Noemt het veld Werkpakket in elk taakbestand ook het pad naar het implementatieplan van Atlas? ...' 'Ja, met pad'; 4 'Staat er n.v.t. bij de paginabrief (en het paginatype) als een taak geen pagina heeft, zoals een backendtaak? ... Dit is een voorstel van Socrates zelf ...' 'Ja, n.v.t.'; 5 'Controleert de hoofdsessie vóór je akkoord op het backlog dat elke paginataak ... een paginabrief en een paginatype noemt, en elke opruimtaak ... vanaf wanneer dat mag? ...' 'Ja, controleren'"}
  - {id: B-52, tekst: "Twee gaten in model 1.0 gevuld, bij het doorvoeren van fase 1 (PRC-08). De uitbreidingslijst staat in docs/uitbreidingslijst.md (ASM-96). Het epic-bestand van een slice heet <slice>-epic-<korte-titel>.md, bijvoorbeeld S01-epic-titel.md (ASM-101). Dit vult goedgekeurde regels aan zonder ze te veranderen; vastgelegd in CHG-072", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: op 'Waar komt de uitbreidingslijst in de klantrepo?' 'docs/uitbreidingslijst.md'; op 'Hoe heet het epic-bestand van een slice?' 'S01-epic-titel.md'"}
  - {id: B-51, tekst: "Ronde 4 en model 1.0 goedgekeurd: het model geldt als model 1.0, met eindontwerp.html als weergave en met drie aanvullingen op al goedgekeurde regels die vooraf geen gecontroleerd wijzigingsvoorstel kregen en achteraf in orde zijn bevonden: (1) de kop van een taakbestand verwijst naar de regelbestanden (B-48); (2) de teksten over de skills, akkoorden en rol van Atlas zijn gelijkgetrokken met wat al goedgekeurd was (CHG-062); (3) een wijzigingsverzoek (ACT-04.4) wordt opgesteld door de eigenaar van het goedgekeurde document, ontvanger of vrager (CHG-070, op aanwijzing van Atlas). Antwoord en advies vallen samen; geen nacontrole nodig (B-44, antwoord 3). Vastgelegd in CHG-071", bron: "antwoord van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: 'Ja, model 1.0'. De vraag, letterlijk zoals gesteld: 'Leggen we het model nu vast als het geldende model 1.0, met deze pagina als weergave en met de drie aanvullingen hieronder? Het gaat om: daarna geldt model 1.0 en volgen de goedgekeurde voorstellen voor de agents en skills, en de afbouw van Paperclip. Je besluit over de vaste sessie Socrates–Atlas is doorgevoerd. Drie aanvullingen op al goedgekeurde regels kregen vooraf geen gecontroleerd wijzigingsvoorstel; de controle achteraf vond ze in orde: (1) de kop van een taakbestand verwijst naar de regelbestanden (je antwoord in ronde 3); (2) de teksten over de skills, akkoorden en rol van Atlas zijn gelijkgetrokken met wat je al goedkeurde; (3) een wijzigingsverzoek wordt opgesteld door de eigenaar van het goedgekeurde document (dat kan ook de vrager zijn), niet altijd door de ontvanger, op aanwijzing van Atlas. Ja betekent ook ja op die drie. Advies: ja. Bij nee zeg je via Other wat er anders moet, en blijft het model Concept; een aanvulling die je niet wilt, draaien we terug of komt als gecontroleerd wijzigingsvoorstel.'"}
  - {id: B-50, tekst: "Voorstel CHG-066 goedgekeurd met optie (c): Socrates en Atlas praten met elkaar in één vaste sessie (de toets en vragen tussen agents), waarin de hoofdsessie elk bericht letterlijk doorgeeft, met één lopend contextverslag (ASM-124). Een productkeuze midden in zo'n sessie, die nog niets goedgekeurds verandert, stelt degene die het antwoord moet geven (of de vrager bij zijn eigen punt) direct aan ROL-01, zonder controle vooraf (ASM-123). B-38 blijft gelden; de agentdefinities veranderen niet. Vraag C en D vervallen (ASM-125 vervallen; OPEN-49 t/m OPEN-53 blijven open). Gevolgen voor de skills in PRP-085 (alleen deel B). Doorgevoerd in CHG-069", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie, beide volgens het advies; letterlijk: A 'Ja, via hoofdsessie', B 'Ja, direct'. De hoofdsessie stelde de vragen met twee lage punten van socrates-licht verwerkt: bij A '(afleiding) minder in de hoofdsessie' bij het alternatief; bij B 'degene die het antwoord moet geven (of de vrager bij zijn eigen punt)'. Socrates-licht had versie 1.0.26 vooraf volledig gecontroleerd"}
  - {id: B-49, tekst: "Vraag 1 van ronde 4 beantwoord, tegen het advies in: de pagina toont per stap ook de werkwijze uit het oude model 0.18 (ASM-122 afgewezen). Daarnaast vroeg ROL-01 een andere weergave van het model: Carlo, de hoofdsessie, Socrates en Atlas in kolommen, met zichtbaar hoe de loops en vragenloops lopen en terugkeren, hoe Socrates en Atlas onderling communiceren, en wanneer hem vragen worden gesteld en zijn goedkeuring nodig is. Uit drie voorgelegde weergaven koos hij 'Interactie (berichten)': per proces een interactiediagram met de kolommen Carlo, hoofdsessie, Socrates, Atlas en de controleurs, met vragenrondes en akkoorden als kaders (CHG-064). Vraag 2 is nog niet beantwoord.", bron: "antwoord van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: vraag 1 'Nee, per stap tonen'. Bij vraag 2 schreef ROL-01 letterlijk: 'ik zou het model in de artifact anders willen. wat ik graag wil zien is ik, de hoofdsessie, socrates en atlas in kolommen. vervolgens wil ik kunnen zien hoe de loops lopen, hoe vragenloops lopen en weer terugkeren bij een eerdere state. nu lijken de taken van socrates en atlas in dezefde kolom opgenomen en is niet duidelijk hoe de communicatie onderling verloopt. wanneer mij vragen worden gesteld en goedkeuring nodig is'. De hoofdsessie legde drie weergaven voor (swimlanes per stap, interactiediagram met berichten, of beide); ROL-01 koos 'Interactie (berichten)'"}
  - {id: B-48, tekst: "Vraag 37 en 38 van ronde 3 beantwoord, beide volgens het advies van Atlas. 37: elk taakbestand in docs/backlog/ verwijst in zijn kop ook naar AGENTS.md, het conventiebestand en CONSTRAINTS.md, naast CLAUDE.md (ASM-102 aangevuld; ACT-02.11; backlog-regie; PRP-077). 38: de commands in CLAUDE.md (bouwen, testen, starten) zijn voorlopig, afgeleid uit de gekozen techniek; de eerste bouwsessie mag ze corrigeren met een melding aan Atlas (ASM-121). Hiermee is ronde 3 compleet beantwoord.", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: 37 'Ja, in elke taak', 38 'Ja, voorlopig'. De vragen kwamen uit de feitencontrole van Atlas op 1.0.18"}
  - {id: B-47, tekst: "Vraag 26 t/m 36 van ronde 3 beantwoord, en het antwoord op vraag 22 gewijzigd. Vraag 22 wordt 'twee kopieën' (PRP-083 deel A ja); met het antwoord op vraag 23 ('Ja, samen') worden bij elke wijziging beide kopieën samen aangepast en vergeleken (deel B ja). Vraag 29 en 30 zijn daardoor niet gesteld en vervallen. Volgens het advies: 26 (CHG-056 goedgekeurd), 27, 31, 33, 34, 35 (ook het deel van CHG-056 dat van vraag 35 afhangt) en 36. Anders dan het advies: 28 ('Nee, nieuwe skill': de kwaliteitslat en de regelbestanden krijgen een aparte, nieuwe skill van Atlas; de instructies van Atlas veranderen hoe dan ook) en 32 ('Alleen verwijzen': CLAUDE.md importeert niets en noemt de andere bestanden met een leesmoment). De status Goedgekeurd van ronde 3 volgt na de nacontrole van de verwerking (B-44, antwoord 3).", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: vraag 22 (gewijzigd) 'ik denk dat het toch beter is om de gedeelde skills als twee kopieen op te slaan'; 26 'Ja, zelfde stap', 27 'Ja, aanvullen', 28 'Nee, nieuwe skill', 31 'Ja, één plek', 32 'Alleen verwijzen', 33 'Ja, werkregels', 34 'Ja, noemen', 35 'Ja, bijwerken', 36 'Ja, ook gebruiken'. Bij vraag 32 vroeg ROL-01 eerst: 'het lijkt mij dat alle skills gelijk inladen onnodig veel tokens verbruikt en de agent op het verkeerde pad zet. hierdoor lijkt verwijzen beter of zie ik dat verkeerd? waarom wil je dit vooraf inladen?'; de hoofdsessie lichtte toe en stelde de vraag opnieuw met drie opties (alleen verwijzen; alleen AGENTS.md importeren; alles importeren)"}
  - {id: B-46, gewijzigd_door: "B-47 (vraag 22: nu twee kopieën)", tekst: "Ronde 3 (rollen- en skillmodel) beantwoord: alle 25 vragen. Volgens het advies: 1 t/m 12, 14, 15, 18, 19, 21, 24 en 25. Met aangepaste vraagtekst gesteld en volgens het advies beantwoord: 13 (alleen atlas-licht als controleur van het werk van Atlas; bewust gekozen dat de controleur bij architectuurkeuze en bouwcontract niet beoordeelt of de keuze de beste is) en 20 (regels uit de skills van Atlas die het model tegenspreken, met een ander voorbeeld). Anders dan het advies: 16 ('Nee, ook kwaliteitslat': Atlas maakt in slice 1 ook CONSTRAINTS.md), 17 ('Nee, Atlas in slice 1': Atlas maakt CLAUDE.md en AGENTS.md in slice 1), 22 ('Nee, één plek': de gedeelde skills komen op één plek in plaats van twee kopieën). Vraag 23 vervalt door antwoord 22. Met ja op vraag 11 is CHG-052 goedgekeurd. De status Goedgekeurd van ronde 3 volgt pas na de nacontrole van de verwerking (B-44, antwoord 3) en de antwoorden op de nieuwe vragen.", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: 1 'Ja, via akkoorden', 2 'Ja, zonder', 3 'Ja, alleen hoofdsessie', 4 'Ja, letterlijk', 5 'Ja, geen maximum', 6 'Ja, uitbreiden', 7 'Ja, vervallen', 8 'Ja, nieuwe skill', 9 'Ja, in backlogskill', 10 'Ja, plugin Socrates', 11 'Ja, mag', 12 'Ja, ook controleren', 13 'Ja, atlas-licht', 14 'Ja, alleen sliceplan', 15 'Ja, altijd', 16 'Nee, ook kwaliteitslat', 17 'Nee, Atlas in slice 1', 18 'Ja, in de skills', 19 'Ja, in de skills', 20 'Ja, eruit', 21 'Ja, eruit', 22 'Nee, één plek', 23 'Ja, samen' (vervallen), 24 'Ja, weg', 25 'Ja, na één doorloop'. Bij vraag 2 vroeg ROL-01 eerst wie de tweede lezer zou zijn; bij vraag 13 of het lichte model het werk van het grotere model controleert; de hoofdsessie lichtte toe en stelde vraag 13 opnieuw met een extra optie"}
  - {id: B-45, tekst: "Vraag 18 t/m 21 van ronde 2 beantwoord, alle vier volgens het advies: alleen ROL-01 (of zijn bouwsessie) zet een taak in docs/backlog/in-progress/, de agents zetten taken alleen in todo (ASM-100); een epic-bestand per slice, dat ROL-01 (of zijn bouwsessie) naar done verplaatst als al zijn taken in done staan (ASM-101); taakbestanden heten <slice>-<nr>-<korte-titel>.md, met bovenin titel, slice, werkpakket, paginabrief, acceptatiecriteria en afhankelijkheden (ASM-102); akkoord met de gewijzigde en nieuwe namen van stappen en beslispunten (vraag 21). Daarmee zijn alle vragen van ronde 2 beantwoord. De status Goedgekeurd volgt pas als socrates-licht de herstelpunten van 1.0.10 (CHG-047) volledig gecontroleerd heeft.", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk: 18 'Ja, alleen ik', 19 'Ja, epic per slice', 20 'Ja, zo', 21 'Ja, akkoord'. Gesteld met de tekst van 1.0.10 (vraag 19 met wie het epic verplaatst, vraag 20 alleen naam en inhoud)"}
  - {id: B-44, tekst: "Ronde 2 (procesmodellering) beantwoord: alle 17 vragen. Volgens het advies: 1, 2, 4, 5, 7, 8, 9, 11, 12, 15, 16 en 17. Anders dan het advies: vraag 3 (poort akkoord, maar met nacontrole van de verwerking van afwijkende antwoorden vóór de status Goedgekeurd); vraag 6 (nee: eerst een wijzigingsverzoek, vooraf gecontroleerd en apart goedgekeurd; ASM-99 vervalt); vraag 10 (nee: de inhaalcheck meldt alleen, ROL-01 beslist); vraag 13 en 14 (eigen antwoord: map docs/backlog/ met één bestand per taak of epic, in de statusmappen todo, in-progress en done, zodat de status zichtbaar is zonder het bestand te openen). CHG-042 deel A en B goedgekeurd met vraag 1, 2, 5, 7, 8, 16 en 17. De status Goedgekeurd volgt pas na de nacontrole van de verwerking (antwoord 3).", bron: "antwoorden van ROL-01 op 2026-11-25, doorgegeven door de hoofdsessie; letterlijk antwoord op 13 en 14: 'In de map docs/backlog zou het baclog moeten staan. met steeds een file voor iedere taak of epic. ingedeeld in mappen zoals todo, in progres of done zodat direct te zien is wat de status van de taak is zonder die te moeten openen.'"}
  - {id: B-43, tekst: "Ronde 1 (organisatieanalyse) goedgekeurd met de antwoorden op alle 21 vragen: ASM-79, 80, 81, 82, 83, 85, 86, 87, 88 bevestigd; ASM-84 en ASM-89 bevestigd zoals gewijzigd door B-40, B-41 en B-42; de korte namen en de versieregel 1.0.x bevestigd; communicatiemodel en afbouwlijst als eigen bestanden in ronde 3; de overige voorstellen na ronde 3 in één keer.", bron: "antwoorden op vraag 1 t/m 21 (2026-11-25), akkoord gemeld door de hoofdsessie"}

