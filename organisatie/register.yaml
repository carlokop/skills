aannames:
  - {id: ASM-28, tekst: "ROL-01 is de ontwerper zolang er geen ontwerp-agent is; een eigen ontwerp keurt hij niet apart goed", status: "overgenomen uit 0.18 (bevestigd in B-12)"}
  - {id: ASM-33, tekst: "Per project loopt hoogstens één doorloop van PRC-02 tegelijk", status: "overgenomen uit 0.18 (bevestigd in B-14)"}
  - {id: ASM-61, tekst: "De processtappen blijven to-be tot ze in een echt project hebben gedraaid", status: "overgenomen uit 0.18 (bevestigd in B-22)"}
  - {id: ASM-79, tekst: "Per klantproject werkt ROL-01 in een eigen hoofdsessie met de klantrepo als werkmap en de plugins socrates en atlas geïnstalleerd", status: "bevestigd (B-43, vraag 1)"}
  - {id: ASM-80, tekst: "De stand van de keten staat in bestanden in de klantrepo: welke stap, welke poorten met datum en letterlijk antwoord van ROL-01, en hoeveel rondes en afkeuringen er waren. Een hervatte of nieuwe hoofdsessie leest die eerst. Atlas houdt al STATUS.md bij (atlas.md r.75); welke bestanden het worden en wie erin schrijft, volgt in ronde 3 (OPEN-37, PRP-075)", status: "bevestigd (B-43, vraag 10)", bron: "feiten §2 en §5; FND-092"}
  - {id: ASM-81, tekst: "Juridische keuzes (zoals privacy, bewaartermijnen en voorwaarden) legt Socrates vast als eisen en bedrijfsregels in het analysepakket; de keuze zelf is van ROL-01", status: "bevestigd (B-43, vraag 9)", bron: "FND-095"}
  - {id: ASM-82, tekst: "GOV-01 en GOV-02 gaan op in GOV-10 (analysepakket), GOV-09 in GOV-15 (richting) en GOV-05 in GOV-11 (ontwerp); in de begintak van een wens gelden dezelfde generieke poorten als in UC1, met GOV-15 alleen bij een wijziging van architectuur of profiel (voor een nieuw paginaontwerp: ASM-86)", status: "bevestigd (B-43, vraag 2)", bron: "B-32"}
  - {id: ASM-83, tekst: "Atlas toetst de backlog-items van de hoofdsessie standaard tegen zijn werkpakketten vóór GOV-18; die toets is de tweede lezer van de backlog-items, er komt geen controle door atlas-licht bij. Op technische punten heeft Atlas het laatste woord en volgt de hoofdsessie hem. Na twee rondes, of bij een conflict over niet-technische punten, beslist ROL-01 (GOV-08; architect-implementation-plan r.194). In 0.18 was de toets een vaste stap (ACT-01.25, ACT-02.14); in de huidige instructies staat hij alleen als de aanroeper erom vraagt (atlas.md r.44)", status: "bevestigd (B-43, vraag 7 en 8); laatste woord van Atlas toegevoegd (CHG-042 deel A, ronde 2 vraag 17, B-44)", was: "'Na twee rondes of bij een conflict beslist ROL-01' (tot 1.0.8)", bron: "atlas.md r.44; 0.18 PRP-027 (Atlas toetst taken tegen werkpakketten, goedgekeurd in B-08); 0.18 prc-01.md ACT-01.25"}
  - {id: ASM-84, tekst: "Ritme in Nederlandse tijd: weekmoment op maandag om 12:00 (B-40): volgorde nagaan en PRC-02 starten als er geen doorloop loopt, ongeacht de drempel. Dagstart zonder vaste tijd, alleen bij het openen of hervatten van de sessie (B-41): flowcheck (start PRC-02 bij de drempel van ASM-89) en melding van wat op ROL-01 wacht. Komen weekmoment en dagstart samen, dan start alleen de eerste een doorloop; de tweede ziet een lopende doorloop (G-02.8, ASM-33)", status: "bevestigd zoals gewijzigd door B-40 en B-41 (B-43, vraag 11 en 12); de laatste zin volgt uit ASM-33", was: "weekmoment maandag 09:00, dagstart werkdagen 09:00 (versie 1.0.3)", bron: "0.18 B-13 (maandag 04:00, werkdagen 09:00), 0.18 PRC-07 en routines (Europe/Amsterdam); feiten §4 (cron haalt niets in)"}
  - {id: ASM-85, tekst: "Het wekmechanisme is een cron-taak (CronCreate) in de hoofdsessie van het klantproject, alleen voor het weekmoment (de dagstart heeft geen vaste tijd, B-41). Bij elke nieuwe of hervatte sessie controleert de hoofdsessie of de cron-taak er is, zet hem zo nodig opnieuw aan en meldt dat; daarna doet ze de inhaalcheck (PRP-076)", status: "bevestigd (B-43, vraag 15, 16 en 17); 'alleen voor het weekmoment' volgt uit B-41", bron: "feiten §4: cron vuurt alleen als Claude inactief is en zolang de sessie open is, haalt niets in, wordt bij --resume hersteld behalve verlopen of al voorbijgegane taken; feiten §5: --resume en --continue herstellen de sessie met de geplande taken; of een herhalende cron-taak verloopt, staat er niet (OPEN-38)"}
  - {id: ASM-86, tekst: "GOV-14 vervalt. ROL-01 keurt zijn eigen ontwerp niet apart goed; de paginabrieven die Socrates op dat ontwerp afstemt, gaan mee in GOV-15: in UC1 en in de begintak van een wens met een nieuw paginaontwerp", status: "bevestigd (B-43, vraag 3)", bron: "0.18 ASM-28 (register.md r.3107); 0.18 ACT-01.58, ACT-02.56"}
  - {id: ASM-87, tekst: "ROL-09 is één rol voor beide controleurs, alleen voor de controle vóór het akkoord. Het overige werk van AGT-09 (verduidelijking van goedgekeurde eisen) valt onder ROL-03, en dat van AGT-10 (onderzoek, betekenis van het goedgekeurde ontwerp, sequentiediagrammen genereren) onder ROL-04", status: "bevestigd (B-43, vraag 4 en 5)", bron: "B-34; socrates-licht.md r.20; atlas-licht.md r.19-21"}
  - {id: ASM-88, tekst: "In de keten genereert Atlas zelf de sequentiediagrammen van een ontwerp dat nog akkoord moet krijgen; atlas-licht genereert alleen uit een al goedgekeurd model. Zo controleert atlas-licht nooit diagrammen die hij zelf maakte, en een fout in het model-JSON herstelt Atlas, niet atlas-licht (nu volgens atlas-licht.md r.36 wel atlas-licht)", status: "bevestigd (B-43, vraag 6)", bron: "bpmn-modelcontrole (controleur is niet de uitvoerder); atlas.md r.39, r.72, r.76; uml-sequence-diagrams r.23, r.31, r.84, r.87, r.88; atlas-licht.md r.21, r.36; feitencontrole Atlas 2026-11-25"}
  - {id: ASM-89, tekst: "Een backlog-item telt als open zolang zijn bestand niet in docs/backlog/done/ staat. Klaar zetten is het bestand naar done verplaatsen; dat doet ROL-01 (of zijn bouwsessie) na de merge. De dagstart telt de taakbestanden van de lopende slice in todo en in-progress, en start PRC-02 bij 10 of minder (B-42)", status: "bevestigd zoals gewijzigd door B-42 (B-43, vraag 13 en 14); vorm van het backlog aangepast aan B-44 (ronde 2, antwoord 13 en 14)", was: "drempel 5 (versie 1.0.3); 'op klaar zetten in het backlog-bestand' (tot 1.0.8)", bron: "0.18 ASM-30 (wat telt als open taak) en ASM-77 (taken done na merge); B-42; OPEN-34"}
  # Nieuw in ronde 2 (procesmodellering); beantwoord op 2026-11-25 (B-44)
  - {id: ASM-90, tekst: "De controle vóór een akkoord (PRC-03) heeft een uitgang: zijn er 2 controlerondes achter elkaar geweest zonder voortgang (geen enkele bevinding opgelost), dan legt de hoofdsessie het aan ROL-01 voor (GOV-08). Rondes met voortgang tellen niet. Bij GOV-18 geldt de regel van Atlas: na 2 toetsrondes of bij een conflict beslist ROL-01 (architect-implementation-plan r.194)", status: "bevestigd (B-44, vraag 2)", bron: "regie r.48 ('herhaal tot volledig gecontroleerd', zonder maximum); de regel 'rondes zonder voortgang' komt uit PRC-04 (0.18 B-15)", waarneming: "Ronde 1 van dit model had vier controlerondes nodig. Elke ronde had voortgang (4 blokkerend, daarna 0 blokkerend met 10 restpunten, daarna 7 vraagteksten, daarna alleen laag). Met deze regel was er niet geëscaleerd; met 'hoogstens 2 rondes' wel, na de tweede ronde (hoofdsessie, 2026-11-25; geen bron)", was: "hoogstens 2 controlerondes, daarna escalatie (versie 1.0.5)"}
  - {id: ASM-91, tekst: "Uitkomst van een akkoordpoort: heeft ROL-01 alle vragen beantwoord en levert de verwerking geen nieuwe keuze op, dan is het een akkoord, ook als hij bij een vraag een ander antwoord koos dan het advies. Week een antwoord af van het advies, dan controleert de controleur van de poort de verwerking (nacontrole) voordat de status Goedgekeurd wordt (B-44, antwoord 3). Levert de verwerking een nieuwe keuze op, dan legt de maker die als nieuwe vraag voor (geen afkeuring). Een afkeuring (PRC-05) is er alleen als ROL-01 het document als geheel afwijst", status: "bevestigd zoals gewijzigd door B-44 (vraag 3: met nacontrole; vraag 4)", was: "zonder nacontrole (tot 1.0.8)", bron: "werkwijze van de hoofdsessie bij ronde 1 (2026-11-25); vragen-en-akkoordrondes werkwijze 1"}
  - {id: ASM-92, tekst: "Meldt een agent dezelfde blokkade een tweede keer nadat de hoofdsessie haar oploste, dan legt de hoofdsessie haar aan ROL-01 voor (GOV-08)", status: "bevestigd (B-44, vraag 12)", bron: "0.18 FND-061 (lus in PRC-06 zonder maximum)"}
  - {id: ASM-93, tekst: "De vaste controle op flowlimieten vervalt. Een flowlimiet is een maximum aan open items; daarboven komt er geen nieuwe slice bij, en in 0.18 wachtte Dr. Evil dan tot er ruimte was (0.18 ACT-02.53 controle 4, ASM-22). Gevolg: de dagstart start pas bij 10 of minder open items (B-42), maar het weekmoment start een slice ongeacht het aantal (B-40, ASM-84). Het backlog kan dan per weekmoment met één slice groeien, ook als er al meer dan 10 items open staan. ROL-01 houdt de controle via het akkoord op het backlog (GOV-18). Daarmee vervalt ook 0.18 ASM-22", status: "bevestigd (B-44, vraag 11)", bron: "0.18 prc-02.md ACT-02.53; 0.18 ASM-22; B-40, B-42", was: "reden in versie 1.0.5: de drempel bewaakt de flow (onjuist, want het weekmoment kijkt niet naar de drempel)"}
  - {id: ASM-94, tekst: "Ook vragen aan ROL-01 en grill-sessies met ROL-01 lopen via PRC-04, zonder telling van rondes en zonder contextverslag-telling (0.18 ASM-48, ASM-75); PRC-04 heet dan 'vragenloop en grill-sessie' (CHG-042). In 0.18 waren dit eigen stappen per proces (ACT-01.4, 01.5, 01.21, 01.22)", status: "bevestigd (B-44, vraag 5 en 16)", bron: "PRC-04 doel (goedgekeurd, 'met wie erover gaat'); vragen-en-akkoordrondes werkwijze 3 en 7", wijziging_1_0_28: "CHG-070 (B-50): geldt ook voor de vraag aan ROL-01 binnen een lopende sessie tussen agents (ASM-123); die vraag telt niet als ronde van de sessie"}
  - {id: ASM-95, tekst: "Slice 1 start direct na het akkoord op het voorlopige sliceplan (GOV-17): het einde van PRC-01 start PRC-02 (CHG-042)", status: "bevestigd (B-44, vraag 7)", bron: "B-35; zonder deze start begint slice 1 pas bij de volgende opening, het weekmoment of een verzoek"}
  - {id: ASM-96, tekst: "De hoofdsessie houdt in de klantrepo een uitbreidingslijst bij met de later-pagina's uit de paginalijst en de wensen van ROL-01; de volgorde bepaalt ROL-01. PRC-02 kiest daaruit een wens als het sliceplan geen slice meer heeft of ROL-01 erom vraagt. Plek: docs/uitbreidingslijst.md (B-52)", status: "bevestigd (B-44, vraag 8); plek aangevuld met B-52", bron: "0.18 ACT-01.29, ACT-02.1, ACT-02.17 (B-10, PRP-033); 0.18 ASM-39 (uitbreidingslijst zonder controleur); B-52", wijziging_chg072: "plek docs/uitbreidingslijst.md (B-52)"}
  - {id: ASM-97, tekst: "De inhaalcheck meldt alleen dat een weekmoment is gemist; ROL-01 beslist of het alsnog wordt uitgevoerd (G-07.3). Een gemist weekmoment wordt niet automatisch ingehaald", status: "bevestigd zoals gewijzigd door B-44 (vraag 10: 'Nee, alleen melden', tegen het advies in)", was: "de inhaalcheck voert een gemist weekmoment één keer alsnog uit (tot 1.0.8)", bron: "ronde 1 antwoord 17; ronde 2 antwoord 10 (2026-11-25)"}
  - {id: ASM-99, tekst: "Verandert een antwoord van ROL-01 (als ontvanger in PRC-04) een al goedgekeurd document, dan is dat antwoord het akkoord op de wijziging (GOV-12), als de vraag vooraf zei dat ze een goedgekeurd document verandert. Er komt geen apart wijzigingsverzoek en geen tweede vraag; de maker voert de wijziging door (documenten-bijwerken). De controle door ROL-09 (B-34) gebeurt dan achteraf, op de doorgevoerde wijziging; levert die een nieuwe keuze op, dan wordt dat een nieuwe vraag aan ROL-01", status: "afgewezen (B-44, vraag 6: 'Nee, wijzigingsverzoek'). Geldt: verandert een antwoord iets wat al goedgekeurd is, dan schrijft de agent eerst een wijzigingsverzoek; dat wordt vooraf gecontroleerd en ROL-01 keurt het apart goed (GOV-12 via PRC-03)", bron: "hercontrole socrates-licht 2026-11-25 (N5); vragen-en-akkoordrondes werkwijze 1 (bij een wijziging horen de vragen bij het voorstel)"}
  - {id: ASM-98, tekst: "Heeft het sliceplan geen slice meer en is er geen wens, dan vraagt de hoofdsessie ROL-01 om een keuze (GOV-07). Een van de antwoorden is 'niets'. Kiest hij dat, dan eindigt de doorloop zonder backlog. Antwoordt hij niet, dan wacht de doorloop: de dagstart noemt de open vraag, en er start geen tweede doorloop (G-02.8)", status: "bevestigd (B-44, vraag 9)", bron: "uitgang voor PRC-02 (bpmn-procesmodellering stap 5)", was: "'kiest hij niets' zonder expliciet antwoord (versie 1.0.5)"}

  # Nieuw bij de verwerking van ronde 2 (backlogstructuur uit B-44, antwoord 13 en 14); bevestigd in B-45
  - {id: ASM-100, tekst: "Alleen ROL-01 (of zijn bouwsessie) verplaatst een backlog-item naar docs/backlog/in-progress/, als de bouw begint; de keten zet items alleen in todo en verplaatst niets daarna", status: "bevestigd (B-45, ronde 2 vraag 18)", bron: "B-44 (statusmappen todo, in-progress, done); bouwen valt buiten de scope (B-29)"}
  - {id: ASM-101, wijziging_chg072: "naam van het epic-bestand (B-52)", tekst: "Elke slice krijgt één epic-bestand (doel van de slice en de lijst van zijn taken) naast een bestand per taak, in dezelfde statusmappen. Het epic-bestand heet <slice>-epic-<korte-titel>.md, bijvoorbeeld S01-epic-titel.md (B-52). Het epic gaat naar done als al zijn taken in done staan; dat verplaatsen doet ROL-01 (of zijn bouwsessie). De dagstart telt alleen taakbestanden", status: "bevestigd (B-45, ronde 2 vraag 19)", bron: "B-44 ('een file voor iedere taak of epic')"}
  - {id: ASM-102, wijziging_chg073: "B-53: werkpakket met het pad van het plan, paginatype, 'Opruimen vanaf' en 'n.v.t.' toegevoegd", tekst: "Een taakbestand heet <slice>-<nr>-<korte-titel>.md (bijvoorbeeld S01-003-inlogpagina.md) en begint met: titel, slice, werkpakket (ID, naam en pad van het implementatieplan), paginabrief ('n.v.t.' bij een taak zonder pagina), paginatype ('n.v.t.' bij een taak zonder pagina), acceptatiecriteria, afhankelijkheden, en bij een opruimtaak na een breaking change 'Opruimen vanaf' (trigger of datum). De status staat alleen in de map, niet in het bestand, zodat die twee niet uit elkaar lopen. Werkpakket, brief, paginatype, acceptatiecriteria, afhankelijkheden en het opruimmoment komen uit het plan van Atlas; nummer en titel geeft de hoofdsessie. De kop verwijst ook naar CLAUDE.md, AGENTS.md, het conventiebestand en CONSTRAINTS.md (B-48)", status: "bevestigd (B-45, ronde 2 vraag 20: naam en inhoud; B-45 blijft het historische besluit); dat de status alleen in de map staat, volgt uit B-44 (statusmappen) en is geen vraag; de verwijzingen in de kop zijn toegevoegd met B-48 (ronde 3 vraag 37: 'Ja, in elke taak'); werkpakket met pad, paginatype, 'Opruimen vanaf' en 'n.v.t.' zijn toegevoegd met B-53 (CHG-073)", bron: "B-44; ACT-02.11; atlas.md r.43; B-48; architect-implementation-plan r.93, r.156, r.196; CHG-073, B-53"}
  # Nieuw in ronde 3 (rollen- en skillmodel), Concept 1.0.12 en 1.0.13; te bevestigen (controle/2026-11-25-ronde-3-vragen.md)
  - {id: ASM-103, tekst: "In de RACI is ROL-01 eindverantwoordelijk via de GOV-momenten. Is een AI-rol A, dan levert die rol het resultaat en staat ervoor in, binnen de besluiten van ROL-01; waar ROL-01 het resultaat niet ziet, staat dat bij de onafhankelijkheid (verantwoordelijkheden.md §4). Met dit akkoord accepteert ROL-01 ook de verdeling van R en A per stap zoals in overzichten/verantwoordelijkheden.md §1", status: "bevestigd (B-46, ronde 3 vraag 1)", bron: "bpmn-rollen-en-skillmodel stap 4; 0.18 verantwoordelijkheden.md (menselijke verantwoordelijkheid)"}
  - {id: ASM-104, tekst: "De stand van de keten staat in één bestand dat alleen de hoofdsessie schrijft: docs/stand-van-de-keten.md (tenzij de projectregels een andere plek noemen). Per akkoord staan daarin de datum, de letterlijke vragen en antwoorden van ROL-01 en de versie van het document; verder de rondes, afkeuringen, blokkades, de lopende doorloop en de datum van het laatste weekmoment. Atlas houdt STATUS.md bij voor zijn eigen documenten (atlas.md r.75), ook met de datum van akkoorden zoals de hoofdsessie die meldt; bij een verschil is de stand leidend. De agents lezen de stand, maar schrijven er niet in. Dit beantwoordt OPEN-37", status: "bevestigd (B-46, ronde 3 vraag 3 en 4)", bron: "ASM-80; PRP-075 (risico: twee schrijvers); FND-093; feitencontrole Atlas (STATUS.md r.75)"}
  - {id: ASM-105, tekst: "Het ritme (weekmoment, cron-taak, inhaalcheck en dagstart) staat in de nieuwe skill backlog-regie, niet in regie", status: "bevestigd (B-46, ronde 3 vraag 9)", bron: "PRP-072 (risico: regie wordt groter, FND-096); PRP-076; PRP-077"}
  - {id: ASM-106, tekst: "De nieuwe skill backlog-regie komt in de plugin socrates, naast regie, omdat de hoofdsessie regie daar al laadt", status: "bevestigd (B-46, ronde 3 vraag 10)", bron: "README.md r.14 (regie in plugin socrates); OPEN-33"}
  - {id: ASM-107, tekst: "De Paperclip-skills in skills/ (backlog-management, weekmoment, quality-gates, delivery-management, escalation-management, agent-orchestration, requirements-orchestration, dependency-management, sprint-planning, oordeel-hulp) zijn uit de repo weggehaald (afbouwlijst C1, B-55; door de hoofdsessie met git rm); de root-README.md r.19 is neutraal (C4, uitgevoerd). De git-geschiedenis bewaart ze. Tot B-54 luidde de tekst: 'gaan weg uit de repo zodra backlog-regie er is'; B-54 liet het moment aan ROL-01", status: "bevestigd (B-46, ronde 3 vraag 24); tekst gewijzigd door B-54, bevestigd en uitgevoerd na B-55 (vraag 1: 'Ja, zo')", bron: "README.md r.19; FND-094; B-54; B-55", wijziging_chg074: "B-54", wijziging_chg078: "B-55: uitgevoerd"}
  - {id: ASM-108, tekst: "A5 (één doorloop van PRC-01 of PRC-02 in Claude Code met de aangepaste skills) blijft de aanbevolen volgorde vóór het uitzetten van Paperclip (B-46); of en wanneer hij Paperclip uitzet (afbouwlijst B1 t/m B4), beslist ROL-01 zelf (B-55). Het uitzetten is geen voorwaarde voor de werkwijze. Tot B-55 luidde de tekst: 'Paperclip gaat pas definitief uit nadat één doorloop van PRC-01 of PRC-02 in Claude Code is gedraaid met de aangepaste skills'", status: "bevestigd (B-46, ronde 3 vraag 25); tekst gewijzigd door B-55 (vraag 1: 'Ja, zo')", bron: "OPEN-11 (werking van de skills); ASM-61; B-55", wijziging_chg078: "B-55"}
  - {id: ASM-109, tekst: "Ook de hoofdsessie (AGT-08, ROL-02) mag vrager zijn in PRC-04, bij een vraag over de werkpakketten van Atlas tijdens ACT-02.11. Dit is de opvolger van TL-08 uit 0.18 (Atlas beantwoordt vragen van de orchestrator over de opdeling). Het verandert de goedgekeurde rij ACT-04.1 (voorstel CHG-052)", status: "bevestigd (B-46, ronde 3 vraag 11); CHG-052 doorgevoerd in 1.0.16", bron: "0.18 agentprofiel-atlas.md TL-08; feitencontrole Atlas 2026-11-25; processen/PRC-04-vragenloop.md (vrager AGT-02 of AGT-03)", nieuw_in: "1.0.13"}
  - {id: ASM-110, tekst: "Het werk van de hoofdsessie zonder tweede lezer blijft zonder controle: de vaste controles na GOV-06 (mechanisch), de uitbreidingslijst (ROL-01 bepaalt de volgorde, ASM-96), de stand en het ritme (ROL-01 ziet ze via de dagstart). Alleen de backlog-items krijgen een tweede lezer (Atlas, ASM-83). Dit breidt 0.18 ASM-39 (alleen de uitbreidingslijst) uit", status: "bevestigd (B-46, ronde 3 vraag 2: 'Ja, zonder')", bron: "0.18 ASM-39; ASM-96; controle socrates-licht 2026-11-25 (B3)", nieuw_in: "1.0.13"}
  - {id: ASM-111, tekst: "Het conventiebestand in slice 1 is genoeg: er komt geen aparte kwaliteitslat (CONSTRAINTS.md met constraint-driven-development). Het conventiebestand dekt al de teststrategie en de definition of done (architect-conventions r.11). In 0.18 hoorde de kwaliteitslat bij ACT-01.56", status: "afgewezen (B-46, ronde 3 vraag 16: 'Nee, ook kwaliteitslat'). Geldt: Atlas maakt in slice 1 ook een kwaliteitslat (CONSTRAINTS.md); uitgewerkt in voorstel CHG-056 en ASM-113", was: "te bevestigen (1.0.13 t/m 1.0.15)", bron: "feitencontrole Atlas 2026-11-25 (vraag 2); architect-conventions r.11; 0.18 ACT-01.56", nieuw_in: "1.0.13"}
  - {id: ASM-112, tekst: "ROL-01 maakt CLAUDE.md en AGENTS.md van het klantproject bij het aanmaken van de klantrepo (ASM-79); Atlas leest ze alleen (atlas.md r.30). In 0.18 maakte Atlas ze in slice 1 (ACT-01.56, samen met CONSTRAINTS.md); in 1.0 heeft geen stap ze", status: "afgewezen (B-46, ronde 3 vraag 17: 'Nee, Atlas in slice 1'). Geldt: Atlas maakt CLAUDE.md en AGENTS.md van het project in slice 1, zoals in 0.18; uitgewerkt in voorstel CHG-056 en ASM-113", was: "te bevestigen (1.0.14, 1.0.15)", bron: "hercontrole Atlas 2026-11-25; 0.18 prc-01.md r.124; CAP-22 was_0_18; atlas.md r.30", nieuw_in: "1.0.14"}
  # Nieuw bij de verwerking van ronde 3 (B-46): ASM-113 t/m ASM-115 (1.0.16, vraag 27, 29, 30); ASM-116 t/m ASM-120 (1.0.17, vraag 31 t/m 35). Beantwoord in B-47.
  - {id: ASM-113, tekst: "Heeft het klantproject al een CLAUDE.md of AGENTS.md (bijvoorbeeld van ROL-01 bij het aanmaken van de repo), dan vult Atlas die aan en vervangt hij ze niet. Wat hij aan bestaande regels wil wijzigen, legt hij voor als vraag aan ROL-01. Botst een bestaande regel met een goedgekeurde NFR, dan wordt dat ook een vraag aan ROL-01, zodat de lat niet stilzwijgend zakt. Projectregels gaan voor (atlas.md r.30)", wijziging_1_0_17: "zin over de botsing met een NFR toegevoegd (feitencontrole Atlas)", status: "bevestigd (B-47, ronde 3 vraag 27)", bron: "B-46 (vraag 17); atlas.md r.30; ASM-79", nieuw_in: "1.0.16"}
  - {id: ASM-114, tekst: "De gedeelde skills (kort, vragen-en-akkoordrondes, architectuurprofielen, documenten-bijwerken, overdracht) komen op één plek: in de plugin socrates, waar ook regie en backlog-regie staan. Socrates en socrates-licht laden ze uit hun eigen plugin; Atlas en atlas-licht laden ze uit de plugin socrates (socrates:<naam>)", status: "vervallen (B-47: vraag 22 gewijzigd in twee kopieën; vraag 29 niet gesteld)", bron: "B-46 (vraag 22: 'Nee, één plek'); ASM-106; feiten §6 (naam van een plugin-skill); OPEN-33", nieuw_in: "1.0.16"}
  - {id: ASM-115, tekst: "De gedeelde skills gaan pas naar één plek nadat een proef heeft laten zien dat een agent uit de ene plugin een skill uit de andere plugin kan laden, ook als voorgeladen skill in 'skills:' van zijn definitie. Tot dan blijven de twee kopieën bestaan, en worden ze samen bijgewerkt", status: "vervallen (B-47: vraag 22 gewijzigd in twee kopieën; vraag 30 niet gesteld). De proef en de geraakte plekken hieronder zijn alleen naslag", bron: "B-46 (vraag 22); OPEN-33; feiten §6 ('staat niet in de gelezen tekst')", nieuw_in: "1.0.16", proef: "de proef test zowel een aanroep met de Skill-tool als het voorladen in 'skills:' (feitencontrole Atlas)", geraakt_na_de_proef: "atlas.md r.8-9 (skills:), r.12, r.38, r.40, r.47, r.51, r.70; atlas-licht.md r.8, r.11; 15 SKILL.md-bestanden onder agents/atlas/skills/ die de gedeelde skills bij naam noemen. De plugin atlas wordt dan afhankelijk van de plugin socrates"}
  - {id: ASM-116, tekst: "Elke afspraak staat op één plek. Het conventiebestand (docs/architecture/) is de bron voor codestijl, structuur, teststrategie en UI-conventies. CONSTRAINTS.md heeft de kwaliteitslat en de definition of done; die gaat dus uit het conventiebestand (nu architect-conventions r.3, r.11). CLAUDE.md is kort: de commands, en verwijzingen naar AGENTS.md, het conventiebestand en CONSTRAINTS.md (ASM-117). In 0.18 kwamen de drie bestanden in plaats van het conventiebestand; in 1.0 komen ze erbij, en zonder deze regel staan afspraken dubbel", status: "bevestigd (B-47, ronde 3 vraag 31)", bron: "feitencontrole Atlas 2026-11-25 (punt 1); 0.18 proces-catalogus.md r.25; architect-conventions r.11 (nu staat de definition of done in het conventiebestand) en r.33 (geen herhaling, alleen verwijzingen)", wijziging_1_0_18: "bron r.33 voor de definition of done gecorrigeerd naar r.11 (W2 van de controle); 'imports of' geschrapt na vraag 32", nieuw_in: "1.0.17"}
  - {id: ASM-117, tekst: "CLAUDE.md importeert AGENTS.md, CONSTRAINTS.md en het conventiebestand met @pad. Alleen wat zo binnenkomt, leest een sessie zeker (feiten §8). Gevolg: ze worden ook geladen in het voorwerk in die klantrepo (FND-105)", status: "afgewezen (B-47, ronde 3 vraag 32: 'Alleen verwijzen', tegen het advies in). Geldt: CLAUDE.md importeert niets. Het noemt AGENTS.md, het conventiebestand en CONSTRAINTS.md met een vast leesmoment in een vaste zin: AGENTS.md bij de start van een taak, het conventiebestand vóór het schrijven van code, CONSTRAINTS.md vóór het afronden van een taak (de skill regelbestanden-en-kwaliteitslat schrijft de zinnen letterlijk voor, onder de kop 'Voor de bouw', B-55 vraag 4). Socrates, Atlas en hun lichte varianten volgen de regels onder die kop niet in het voorwerk (B-55 vraag 4; socrates.md r.30, socrates-licht.md r.26, atlas.md r.30, atlas-licht.md r.29). Elk taakbestand verwijst er ook naar (B-48). Zo worden de bestanden niet in elke sessie geladen, ook niet in het voorwerk. Restrisico: de bouw leest ze alleen als een sessie de instructie opvolgt; AGENTS.md wordt bij een aanwezige CLAUDE.md niet vanzelf gelezen (feiten §8). Voorbehoud §8: dat subagents dezelfde CLAUDE.md krijgen, komt uit een samenvatting, en of het voor plugin-agents geldt, is niet gevonden", bron: "claude-code-feiten.md §8; B-47; B-48; B-55; feitencontrole Atlas 2026-11-25", nieuw_in: "1.0.17", wijziging_1_0_19: "zelfde patroon als ASM-111 en ASM-112 (W2 van de nacontrole); vaste leesmomenten (feitencontrole Atlas)", wijziging_chg078: "B-55 vraag 4: kop 'Voor de bouw' (regelbestanden-en-kwaliteitslat r.45) en niet volgen in het voorwerk (vier agentdefinities)"}
  - {id: ASM-122, tekst: "De pagina toont de werkwijze van Paperclip (model 0.18) niet als aparte weergave per stap. Wat Paperclip deed en wat wegvalt, staat in het communicatiemodel (kolommen 'Vervangt in Paperclip' en 'Wat wegvalt', en de sectie 'Wat wegvalt'), bij de Paperclip-resten (ook per stap in het paneel, sinds 1.0.21) en in de afbouwlijst. Het volledige model 0.18 blijft in organisatie/bronnen/paperclip-0.18/", status: "afgewezen (B-49, ronde 4 vraag 1: 'Nee, per stap tonen', tegen het advies in). Geldt: de pagina toont per stap ook de werkwijze uit 0.18, uit was_0_18 in 'activiteiten' en de stappen in communicatiemodel.md §2, met een algemene regel over issues, wekken en kaarten (overdracht 3, 4, 5 en 7). Bestond een stap niet in 0.18, dan zegt de pagina dat. Niets toegevoegd wat niet in het register of de documenten staat", bron: "bpmn-eindontwerp stap 2 (keuze tussen huidige en gewenste situatie als beide bestaan); B-28; B-49", nieuw_in: "1.0.20", wijziging_1_0_23: "CHG-064"}
  - {id: ASM-123, tekst: "Stuit een agent in een lopende sessie op een productkeuze die nog niets goedgekeurds verandert, dan stelt hij die direct aan ROL-01, als vraag in de sessie (K2, K4, K3), zonder controle vooraf: de ontvanger die het antwoord moet geven, of de vrager bij zijn eigen punt. Het antwoord van ROL-01 is de keuze (zoals de afwijking bij G-04.1) en wordt bindend in het akkoord op het document waar ze in komt. De vraag telt niet als ronde van de sessie. Verandert het antwoord een goedgekeurd document, dan volgt een wijzigingsverzoek met controle vooraf (GOV-12; B-44 antwoord 6, ongewijzigd)", status: "bevestigd (B-50, vraag B: 'Ja, direct')", bron: "voorstel-model-chg066.md; feitencontrole Atlas (wie de vraag stelt)", nieuw_in: "1.0.27"}
  - {id: ASM-124, tekst: "Een sessie tussen Socrates en Atlas (de toets en vragen tussen agents, PRC-04) is één vaste sessie met één lopend contextverslag, dat de vrager na elke ronde bijwerkt in contextverslag.md. De ontvanger bevestigt het aan het eind (ASM-58). De hoofdsessie geeft elk bericht letterlijk door (B-38 blijft) en houdt de stand per ronde bij (ASM-104)", status: "bevestigd (B-50, vraag A: 'Ja, via hoofdsessie')", bron: "voorstel-model-chg066.md", nieuw_in: "1.0.27"}
  - {id: ASM-125, tekst: "Alleen de agent met de vraag start de ander (alleen bij optie a van CHG-066)", status: "vervallen (B-50: vraag A ja, dus vraag C niet gesteld)", bron: "voorstel-model-chg066.md", nieuw_in: "1.0.27"}
  - {id: ASM-121, tekst: "De commands in CLAUDE.md (bouwen, testen, starten) zijn voorlopig, afgeleid uit de gekozen techniek (technisch ontwerp, architectuurkeuze). De eerste bouwsessie mag ze corrigeren, met een melding aan Atlas", status: "bevestigd (B-48, ronde 3 vraag 38: 'Ja, voorlopig')", bron: "feitencontrole Atlas 2026-11-25; B-48", nieuw_in: "1.0.19"}
  - {id: ASM-118, tekst: "AGENTS.md bevat werkregels voor de bouw die niet aan één tool gebonden zijn (in 0.18: 'de compacte ponytail-regels', prc-01.md r.124). Omdat AGENTS.md niet wordt geïmporteerd, noemt CLAUDE.md een leesmoment (ASM-117). De zes werkregels (B-55 vraag 3): (1) alleen ROL-01 of zijn bouwsessie verplaatst een taak naar in-progress en done; (2) een implementatie- of ontwerpvraag gaat naar Atlas; (3) een vraag over een eis of paginabrief gaat naar Socrates; (4) een nieuw component zonder goedgekeurd ontwerp is een vraag aan de ontwerper (ROL-01); (5) een ontwerpafwijking die een reviewer ziet, gaat naar Atlas; (6) de commando's in CLAUDE.md zijn voorlopig; de eerste bouwsessie mag ze corrigeren, met een melding aan Atlas (ASM-121)", status: "bevestigd (B-47, ronde 3 vraag 33); de zes regels bevestigd in B-55 (vraag 3: 'Ja, deze zes')", bron: "feitencontrole Atlas 2026-11-25 (punt 3); 0.18 prc-01.md r.124; B-55; regelbestanden-en-kwaliteitslat r.33-39", nieuw_in: "1.0.17", wijziging_chg078: "B-55 vraag 3"}
  - {id: ASM-119, tekst: "CLAUDE.md noemt de indeling van docs/: gebruikersdocumentatie in docs/user/, de rest technisch (0.18 PRP-051)", status: "bevestigd (B-47, ronde 3 vraag 34)", bron: "feitencontrole Atlas 2026-11-25 (punt 3); 0.18 prc-01.md r.124, PRP-051", nieuw_in: "1.0.17"}
  - {id: ASM-120, tekst: "Atlas werkt het conventiebestand, CONSTRAINTS.md, CLAUDE.md en AGENTS.md bij in ACT-02.6 of ACT-02.7 als een wens of slice een nieuwe NFR of afspraak meebrengt. De rijen staan in voorstel CHG-056 (deel 'alleen bij ja op vraag 35') en zijn doorgevoerd", status: "bevestigd (B-47, ronde 3 vraag 35)", bron: "feitencontrole Atlas 2026-11-25 (punt 4)", nieuw_in: "1.0.17"}

open_vragen:
  - {id: OPEN-11, tekst: "Werken de skills in de praktijk zoals beschreven? Pas vast te stellen bij een proefrun of de eerste echte opdracht", wie: ROL-01, status: "overgenomen uit 0.18, open"}
  - {id: OPEN-13, tekst: "Vanaf welke drempel wachten uitbreidingen aantoonbaar op Atlas, zodat een aparte agent naast Atlas nodig is?", wie: ROL-01, status: "overgenomen uit 0.18, open; de toets van de backlog-items komt erbij (FND-018)"}
  - {id: OPEN-24, tekst: "Is geen maximum bij vragen aan ROL-01 een bewuste keuze? (0.18 FND-062)", wie: ROL-01, status: "beantwoord (B-46, ronde 3 vraag 5): bewust geen maximum; ROL-01 bepaalt het einde"}
  - {id: OPEN-25, tekst: "Telt de skillstatus koppelen als gedeeltelijk of als aanwezig? (0.18 FND-076)", wie: ROL-01, status: "overgenomen uit 0.18; open. In 1.0.13 heeft geen enkele skill de status koppelen (skills uit een andere plugin staan op onbekend, OPEN-33), dus de vraag speelt nu niet en wordt niet voorgelegd"}
  - {id: OPEN-31, tekst: "Draait een geplande taak in de desktop-app ook als de app dicht is, en kan zo'n taak de hoofdsessie van het klantproject wekken of de klantrepo lezen? De feiten noemen alleen: lokaal, minimum 1 uur", wie: "onderzoek (hoofdsessie)", bron: "feiten §4"}
  - {id: OPEN-32, tekst: "Hoe meldt een gewone achtergrond-subagent de hoofdsessie dat hij klaar is? In de gelezen documentatie niet gevonden", wie: "onderzoek (hoofdsessie)", bron: "feiten §4", stand: "waarneming van de hoofdsessie op 2026-11-25: er kwam een melding; geen bron"}
  - {id: OPEN-33, tekst: "Kan een agent uit de plugin socrates skills uit de plugin atlas gebruiken, en omgekeerd? Niet in de gelezen tekst; nu staan gedeelde skills in beide plugins", wie: "onderzoek (hoofdsessie)", stand_1_0_18: "open; geen voorwaarde meer, want de gedeelde skills blijven twee kopieën (B-47, vraag 22 gewijzigd). Het blijft van belang voor de skills uit andere plugins (status onbekend)", bron: "feiten §6; agents/socrates/skills/ en agents/atlas/skills/ (kort, vragen-en-akkoordrondes, architectuurprofielen, documenten-bijwerken, overdracht)"}
  - {id: OPEN-34, tekst: "Waar en in welke vorm staat het backlog-bestand in de klantrepo, en hoe zet ROL-01 een item op klaar (ASM-89)?", wie: ROL-01, status: "beantwoord (B-44, vraag 13 en 14): map docs/backlog/ met één bestand per taak of epic, in de statusmappen todo, in-progress en done. Klaar zetten is het bestand naar done verplaatsen. Uitwerking: ASM-89, ASM-100 t/m ASM-102", bron: "B-37"}
  - {id: OPEN-35, tekst: "Waar zet ROL-01 de export van het design systeem en de ontwerpen in de klantrepo?", wie: ROL-01, status: "beantwoord (B-44, vraag 15): docs/design/, per aanlevering een map met de datum, tenzij de projectregels een andere plek noemen", bron: "0.18: op het issue; Paperclip vervalt"}
  - {id: OPEN-36, tekst: "Kan memory (autoMemoryEnabled) de stand van de keten bewaren? De pagina is niet gelezen", wie: "onderzoek (hoofdsessie)", bron: "feiten §5"}
  - {id: OPEN-37, tekst: "Hoe wordt een akkoord van ROL-01 vastgelegd zonder goedkeuringskaart, zodat het later aantoonbaar is, en wie schrijft de stand van de keten (Atlas in STATUS.md en de hoofdsessie)?", wie: ROL-01, status: "beantwoord (B-46, ronde 3 vraag 3 en 4): ASM-104", bron: "FND-093; PRP-075; feiten, afleidingen"}
  - {id: OPEN-38, tekst: "Verloopt een herhalende cron-taak na een tijd? De feiten noemen 30 dagen alleen bij /loop. Bekend is wel: bij --resume komen cron-taken terug, behalve verlopen of al voorbijgegane taken", wie: "onderzoek (hoofdsessie)", bron: "feiten §4"}
  - {id: OPEN-39, tekst: "Hoe lang blijft het transcript van de hoofdsessie bewaard? De feiten noemen alleen de transcripten van subagents (cleanupPeriodDays, standaard 30 dagen)", wie: "onderzoek (hoofdsessie)", bron: "feiten §2"}
  - {id: OPEN-40, tekst: "Werken geplande taken (cron) in de VS Code-extensie net zo als in de terminal?", wie: "onderzoek (hoofdsessie)", bron: "vraag van ROL-01 bij vraag 11 (2026-11-25); niet in de feiten", nieuw_in: "1.0.4"}
  - {id: OPEN-41, tekst: "Wat gebeurt er met een cron-taak als Claude op het geplande moment bezig is: vuurt hij zodra Claude inactief is, of slaat hij het moment over? De feiten zeggen alleen dat cron alleen vuurt als Claude inactief is en niets inhaalt", wie: "onderzoek (hoofdsessie)", bron: "feiten §4; B-40 (maandag 12:00, mogelijk tijdens werk in de sessie)", nieuw_in: "1.0.5"}
  - {id: OPEN-42, tekst: "Welke klantprojecten hebben nog open werk in Paperclip (issues, epics, taken, open kaarten of vragen) dat naar de klantrepo moet?", wie: ROL-01, bron: "afbouwlijst-paperclip.md stap A3; niet in de bronnen", nieuw_in: "1.0.12"}
  - {id: OPEN-43, tekst: "Kan Paperclip issues, comments, documenten met revisies en goedkeuringskaarten exporteren, zodat de akkoorden uit 0.18 en de klantprojecten bewaard blijven? Niet in de bronnen", wie: "onderzoek (ROL-01, in Paperclip)", bron: "afbouwlijst-paperclip.md stap A4; 0.18 paperclip-mapping.md (kaarten, documenten met revisies)", nieuw_in: "1.0.12"}
  - {id: OPEN-44, tekst: "Draaien de routines Weekmoment klaarzetten en Dagstart van Dr. Evil nog, of staan ze nog op pauze? Volgens 0.18 stonden ze sinds 2026-11-16 op pauze en zou Dr. Evil ze weer aanzetten", wie: "onderzoek (ROL-01, in Paperclip)", bron: "0.18 paperclip-mapping.md r.12 en M-4; afbouwlijst-paperclip.md stap B1", nieuw_in: "1.0.12"}
  - {id: OPEN-45, tekst: "Hoe komt de skill regie in de hoofdsessie: laadt Carlo hem met de Skill-tool, of laadt Claude Code hem op de beschrijving? En dat Carlo in de hoofdsessie typt (kanaal K6), staat als afleiding in de feiten, niet als bron. Waarneming in deze sessie, geen bron: Carlo typt in de hoofdsessie, en regie is geladen met de Skill-tool op zijn verzoek", wie: "onderzoek (hoofdsessie)", bron: "controle socrates-licht 2026-11-25 (B4); feiten §1, afleiding 1; communicatiemodel.md K6; agent-skillmatrix.md (AGT-08)", nieuw_in: "1.0.13"}
  - {id: OPEN-48, tekst: "Mag Atlas volgens zijn definitie CLAUDE.md, AGENTS.md en CONSTRAINTS.md in de root van de klantrepo schrijven? atlas.md r.101 noemt 'documentatie en modellen (standaard onder docs/) en GLOSSARY.md'. Feitencontrole door Atlas", wie: "Atlas", status: "beantwoord (feitencontrole Atlas, 2026-11-25): nee. atlas.md r.101 staat het niet toe; PRP-084 wijzigt r.101 en r.31 dus altijd", bron: "B-46 (vraag 16 en 17); atlas.md r.101; PRP-084", nieuw_in: "1.0.16"}
  - {id: OPEN-49, tekst: "Kan een geneste subagent (bijvoorbeeld Atlas, gestart door Socrates) later met zijn eigen geschiedenis worden hervat, door de starter of door de hoofdsessie?", wie: "onderzoek", status: open, bron: "voorstel CHG-066 optie (a); claude-code-feiten.md §1, §2 (niet gevonden)", nieuw_in: "1.0.25"}
  - {id: OPEN-50, tekst: "Kan een agent uit de plugin socrates een agent uit de plugin atlas starten?", wie: "onderzoek, samen met OPEN-33", status: open, bron: "voorstel CHG-066 optie (a); claude-code-feiten.md §6 (alleen de naam <plugin>:<naam>)", nieuw_in: "1.0.25"}
  - {id: OPEN-51, tekst: "Komen permissieprompts van een geneste subagent bij de gebruiker? Feiten §1 noemt het alleen voor subagents op de voorgrond; dat het voor geneste subagents anders kan zijn, is een afleiding", wie: "onderzoek", status: open, bron: "voorstel CHG-066 optie (a); claude-code-feiten.md §1", nieuw_in: "1.0.25"}
  - {id: OPEN-52, tekst: "Wat gebeurt er met een geneste subagent als de run van de starter eindigt, en wat krijgt de starter van de geneste subagent terug (zijn eindbericht, of meer)?", wie: "onderzoek", status: open, bron: "controle socrates-licht op CHG-066 (B1); claude-code-feiten.md §1 (niet gevonden)", nieuw_in: "1.0.26"}
  - {id: OPEN-53, tekst: "Kan tools beperken welke agents een subagent mag starten (bijvoorbeeld alleen atlas:atlas, niet de controleurs)? Zonder dat antwoord is ASM-125 een afspraak", wie: "onderzoek", status: open, bron: "feitencontrole Atlas op CHG-066; claude-code-feiten.md §1 (alleen Agent aan of uit)", nieuw_in: "1.0.26"}
  - {id: OPEN-47, tekst: "Hoe publiceert de hoofdsessie een ontwerppagina als Artifact, en hoe komt de URL bij Atlas? Artifacts staan niet in de feiten; regie r.56 en atlas.md r.46 zijn instructies, geen feiten over Claude Code. Waarneming van de hoofdsessie in deze sessie, geen bron: de hoofdsessie heeft een Artifact-tool, subagents niet", wie: "onderzoek (hoofdsessie)", bron: "controle socrates-licht 2026-11-25 (N1); communicatiemodel.md overdracht 23", nieuw_in: "1.0.14"}
  - {id: OPEN-46, tekst: "Volstaat de instructie in de agentdefinities (eindbericht met status geblokkeerd) voor ACT-06.1, of hoort het melden van een blokkade in een skill? Blijkt bij de proefrun (OPEN-11, ASM-108)", wie: "onderzoek (proefrun)", bron: "controle socrates-licht 2026-11-25 (W6); socrates.md en atlas.md, Eindbericht", nieuw_in: "1.0.13"}

